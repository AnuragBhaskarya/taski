#:schema node_modules/wrangler/config-schema.json
name = "taski"
pages_build_output_dir = "."
compatibility_date = "2026-09-19"

[[d1_databases]]
binding = "TASKI_DB"
database_name = "taski-sync"
database_id = "01c5334e-3a44-479d-aa20-eaaaf439f92c"

[[kv_namespaces]]
binding = "TASKI_KV"
id = "ef0358011d554c1cb1a7f5b595fdf5dd"

# SUPABASE_URL and SUPABASE_ANON_KEY are configured as plain-text
# environment variables on the Pages project itself. Defining them again
# under [vars] conflicts with those existing bindings at deploy time.
