<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <title>Taski — Minimal Real-Time Task Manager</title>
  <meta name="description" content="Taski is a frictionless, minimal real-time task manager featuring spring physics reordering, instant cloud sync, and dark/light modes.">

  <!-- Open Graph / Facebook / Discord / LinkedIn / WhatsApp Social Media Banners -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Taski">
  <meta property="og:title" content="Taski — Minimal Real-Time Task Manager">
  <meta property="og:description" content="Frictionless, minimal real-time task manager with spring physics reordering, cloud sync, and sleek aesthetics.">
  <meta property="og:image" content="/assets/banner-social.png">
  <meta property="og:image:secure_url" content="/assets/banner-social.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Taski — Minimal Real-Time Task Manager">
  <meta property="og:image" content="/assets/icon-512.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- Twitter / X Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Taski — Minimal Real-Time Task Manager">
  <meta name="twitter:description" content="Frictionless, minimal real-time task manager with spring physics reordering, cloud sync, and sleek aesthetics.">
  <meta name="twitter:image" content="/assets/banner-social.png">
  <meta name="twitter:image:alt" content="Taski — Minimal Real-Time Task Manager">

  <!-- PWA & Mobile Configuration -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taski">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Taski">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Favicons and Apple Touch Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/icon-120.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <div class="header-title">Taski</div>
      <time class="header-date" id="headerDate"></time>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="header-icon-btn" aria-label="Toggle theme">
        <!-- Sun/Moon SVG — starts as moon (light mode) -->
        <svg id="themeIconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="themeIconSun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button id="completedBtn" class="header-icon-btn" aria-label="View completed tasks">
        <!-- Checkmark circle SVG -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <ul id="taskList" class="task-list">
      <!-- Active tasks injected via JS -->
    </ul>
  </main>

  <div id="fabContainer" class="fab-container">
    <label id="fabAdd" class="fab-btn fab-add" for="modalInput">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </label>
  </div>

  <!-- Add Task Modal -->
  <div id="addModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="modal-title">New Task</h3>
      <input type="text" id="modalInput" class="modal-input" placeholder="What needs to be done?" autocomplete="off" />
      <div class="modal-actions">
        <button id="modalCancel" class="modal-btn cancel-btn">Cancel</button>
        <button id="modalConfirm" class="modal-btn confirm-btn">Add</button>
      </div>
    </div>
  </div>

  <!-- Completed Tasks Panel -->
  <div id="completedPanel" class="completed-panel hidden">
    <div class="completed-panel__header">
      <h3 class="completed-panel__title">Completed</h3>
      <div class="completed-panel__actions">
        <button id="completedCalendarBtn" class="completed-panel__calendar" aria-label="Open completed calendar" aria-haspopup="dialog" title="Jump to a completed date">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="3" ry="3"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <circle cx="8" cy="15" r="1" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="15" r="1" fill="currentColor" stroke="none"/>
            <circle cx="16" cy="15" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button id="completedClose" class="completed-panel__close" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <ul id="completedList" class="task-list completed-task-list">
      <!-- Completed tasks injected via JS -->
    </ul>
    <div id="completedEmpty" class="completed-empty">No completed tasks yet</div>
  </div>

  <!-- Completed History Calendar -->
  <dialog id="completedCalendarDialog" class="taski-calendar-dialog" closedby="any" aria-labelledby="taski-calendar-title-btn">
    <div class="taski-calendar-shell" id="taski-calendar-shell" tabindex="-1">
      <div class="taski-calendar-header" id="taski-calendar-header">
        <button type="button" class="taski-calendar-title-btn" id="taski-calendar-title-btn" aria-label="Select month and year" aria-expanded="false">
          <span class="taski-calendar-title-text" id="taski-calendar-title">Oct 2026</span>
          <svg class="taski-calendar-chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <button type="button" class="taski-calendar-close" id="btn-close-completed-calendar" aria-label="Close calendar">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="taski-calendar-main-view" id="taski-calendar-main-view">
        <div class="taski-calendar-shortcuts" aria-label="Jump shortcuts">
          <button type="button" class="taski-calendar-pill" data-jump="today">Today</button>
          <button type="button" class="taski-calendar-pill" data-jump="yesterday">Yesterday</button>
          <button type="button" class="taski-calendar-pill" data-jump="latest">Latest</button>
          <button type="button" class="taski-calendar-pill" data-jump="first">First</button>
        </div>

        <div class="taski-calendar-weekdays" aria-hidden="true">
          <span>Su</span>
          <span>Mo</span>
          <span>Tu</span>
          <span>We</span>
          <span>Th</span>
          <span>Fr</span>
          <span>Sa</span>
        </div>

        <div class="taski-calendar-viewport" id="taski-calendar-viewport">
          <div class="taski-calendar-track" id="taski-calendar-track">
            <div class="taski-calendar-slide" aria-hidden="true">
              <div class="taski-calendar-grid" id="taski-calendar-grid-prev"></div>
            </div>
            <div class="taski-calendar-slide is-active-slide">
              <div class="taski-calendar-grid" id="taski-calendar-grid"></div>
            </div>
            <div class="taski-calendar-slide" aria-hidden="true">
              <div class="taski-calendar-grid" id="taski-calendar-grid-next"></div>
            </div>
          </div>
        </div>

        <div class="taski-calendar-footer">
          <span id="taski-calendar-month-count">0 completed</span>
          <span class="taski-calendar-footer-dot" aria-hidden="true">·</span>
          <span id="taski-calendar-month-days">0 days</span>
        </div>
      </div>

      <div class="taski-calendar-dial-view" id="taski-calendar-dial-view" style="display: none;">
        <div class="taski-calendar-dial-frame" id="taski-calendar-dial-frame">
          <div class="taski-calendar-dial-fade top" aria-hidden="true"></div>
          <div class="taski-calendar-dial-fade bottom" aria-hidden="true"></div>
          <div class="taski-calendar-dial-lens" aria-hidden="true"></div>

          <div class="taski-calendar-drum" id="taski-calendar-drum-month" role="listbox" aria-label="Select month">
            <div class="taski-calendar-drum-wheel" id="taski-calendar-drum-wheel-month"></div>
          </div>
          <div class="taski-calendar-drum-divider" aria-hidden="true"></div>
          <div class="taski-calendar-drum" id="taski-calendar-drum-year" role="listbox" aria-label="Select year">
            <div class="taski-calendar-drum-wheel" id="taski-calendar-drum-wheel-year"></div>
          </div>
        </div>

        <button type="button" class="taski-calendar-dial-done" id="taski-calendar-dial-done">Done</button>
      </div>
    </div>
  </dialog>

  <div id="taskiCalendarToast" class="taski-calendar-toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=3.0"></script>

  <!-- SERVICE WORKER REGISTRATION (PWA Offline & Mobile Support) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(registration) {
            console.log('[Taski PWA] Service worker registered with scope:', registration.scope);
            registration.update();
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          })
          .catch(function(error) {
            console.warn('[Taski PWA] Service worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
