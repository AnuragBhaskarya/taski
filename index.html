<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Taski" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Taski</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-title">Taski</div>
    <div class="header-actions">
      <button id="completedBtn" class="header-icon-btn" aria-label="View completed tasks">
        <!-- Checkmark circle SVG -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </button>
      <button id="themeToggle" class="header-icon-btn" aria-label="Toggle theme">
        <!-- Sun/Moon SVG — starts as moon (light mode) -->
        <svg id="themeIconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="themeIconSun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <ul id="taskList" class="task-list">
      <!-- Active tasks injected via JS -->
    </ul>
  </main>

  <div id="fabContainer" class="fab-container">
    <button id="fabAdd" class="fab-btn fab-add">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- Add Task Modal -->
  <div id="addModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="modal-title">New Task</h3>
      <input type="text" id="modalInput" class="modal-input" placeholder="What needs to be done?" autocomplete="off" />
      <div class="modal-actions">
        <button id="modalCancel" class="modal-btn cancel-btn">Cancel</button>
        <button id="modalConfirm" class="modal-btn confirm-btn">Add</button>
      </div>
    </div>
  </div>

  <!-- Completed Tasks Panel -->
  <div id="completedPanel" class="completed-panel hidden">
    <div class="completed-panel__header">
      <h3 class="completed-panel__title">Completed</h3>
      <button id="completedClose" class="completed-panel__close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <ul id="completedList" class="task-list completed-task-list">
      <!-- Completed tasks injected via JS -->
    </ul>
    <div id="completedEmpty" class="completed-empty">No completed tasks yet</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
